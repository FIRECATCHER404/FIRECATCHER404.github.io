<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#242424">
  <meta name="description" content="Play tic-tac-toe against the computer or an online opponent.">
  <title>Tic-tac-toe</title>
  <link rel="stylesheet" href="../site.css">
  <style>
    [hidden] { display: none !important; }
    .game-page { align-items: center; justify-content: center; padding: 1.25rem; }
    .game-card { width: min(100%, 460px); padding: clamp(1.25rem, 5vw, 2rem); border: 1px solid var(--line); border-radius: 12px; background: var(--surface); text-align: center; }
    .game-card h1 { font-size: clamp(1.8rem, 6vw, 2.3rem); }
    .game-description { font-size: 0.95rem; }
    .mode-buttons { display: grid; gap: 0.75rem; margin-top: 1.5rem; }
    #status { min-height: 1.65em; margin-block: 1.25rem; color: var(--text); font-size: 0.95rem; }
    #board { display: grid; width: 100%; max-width: 340px; margin-inline: auto; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.5rem; }
    .cell { display: grid; place-items: center; width: 100%; aspect-ratio: 1; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--background); color: var(--text); font-family: var(--mono); font-size: clamp(2rem, 10vw, 3rem); line-height: 1; cursor: pointer; }
    .cell:not(:disabled):hover { background: #383838; border-color: var(--text); }
    .cell:disabled { cursor: default; opacity: 1; }
    .cell[data-symbol="O"] { color: #acd5bc; }
    .cell.win { background: var(--text); color: var(--background); }
    button:focus-visible { outline: 2px solid var(--text); outline-offset: 4px; }
    .game-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.5rem; }
    .game-actions .btn { font-size: 0.85rem; padding-inline: 1rem; cursor: pointer; }
    .projects-link { margin-top: 1.5rem; }
  </style>
  <script src="/analytics.js" defer></script>
  <script type="module" src="ticktacktoe.js"></script>
</head>
<body class="game-page">
  <main class="game-card">
    <h1>Tic-tac-toe</h1>
    <div id="menu">
      <p class="game-description">Play against the computer or find an online opponent.</p>
      <div class="mode-buttons">
        <button class="btn" id="play-ai" type="button">Play vs AI</button>
        <button class="btn" id="play-online" type="button">Play online</button>
      </div>
    </div>
    <p id="status" role="status" aria-live="polite" aria-atomic="true">Choose a game to get started.</p>
    <div id="board" role="group" aria-label="Tic-tac-toe board" hidden></div>
    <div class="game-actions" id="game-actions" hidden>
      <button class="btn" id="new-round" type="button">New round</button>
      <button class="btn" id="change-mode" type="button">Back to menu</button>
    </div>
    <a class="btn projects-link" href="index.html">Back to projects</a>
  </main>
</body>
</html>
