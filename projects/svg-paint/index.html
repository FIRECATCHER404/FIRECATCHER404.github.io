<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f3f3"><meta name="description" content="A simple vector drawing app with editable points and rounded corners."><title>SVG Paint</title><link rel="stylesheet" href="style.css?v=1"><script src="/analytics.js" defer></script><script type="module" src="app.js?v=1"></script></head><body>
<header class="titlebar"><a href="../">Projects</a><h1>SVG Paint</h1><nav aria-label="File"><button id="new">New</button><button id="import">Import SVG</button><button id="open">Open project</button><button id="save">Save project</button><button id="export">Export SVG</button></nav><a href="../shape-morph/">Animate</a><button id="theme" aria-label="Switch to dark theme">Dark</button></header>
<div class="ribbon" aria-label="Drawing tools">
<div class="group history"><button id="undo" title="Undo (Ctrl+Z)">Undo</button><button id="redo" title="Redo (Ctrl+Shift+Z)">Redo</button><span>Edit</span></div>
<div class="group"><div class="tool-grid"><button data-tool="select" aria-pressed="true">Select</button><button data-tool="points">Points</button><button data-tool="pencil">Pencil</button><button data-tool="polygon">Polygon</button></div><span>Tools</span></div>
<div class="group"><div class="tool-grid shapes"><button data-tool="rectangle">Rectangle</button><button data-tool="ellipse">Ellipse</button><button data-tool="triangle">Triangle</button><button data-tool="diamond">Diamond</button><button data-tool="star">Star</button><button data-tool="line">Line</button></div><span>Shapes</span></div>
<div class="group colors"><div class="color-row"><label><input id="fill-enabled" type="checkbox" checked>Fill <input id="fill" type="color" value="#427ee8" aria-label="Fill color"></label><label><input id="stroke-enabled" type="checkbox" checked>Outline <input id="stroke" type="color" value="#20242a" aria-label="Outline color"></label><label>Width <input id="strokeWidth" type="number" min="0" max="512" value="2"></label></div><div id="palette" aria-label="Fill colors"></div><span>Colors</span></div>
<div class="group"><button id="finish" disabled>Finish polygon</button><button id="cancel-draw" disabled>Cancel</button><span>Enter to finish · Esc to cancel</span></div>
</div>
<div class="workspace"><main id="stage" aria-label="Drawing workspace"><div id="paper"><svg id="canvas" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-label="SVG drawing canvas"><g id="artwork"></g><g id="guides"></g></svg></div></main>
<aside><h2>Shape</h2><p id="no-selection">Select a shape to edit it.</p><div id="properties" hidden><label>Name <input id="name" maxlength="100"></label><div class="fields"><label>X <input id="x" type="number" step="1"></label><label>Y <input id="y" type="number" step="1"></label><label>Width <input id="w" type="number" min="0" step="1"></label><label>Height <input id="h" type="number" min="0" step="1"></label></div><label>Rotation <input id="rotation" type="number" step="1"></label><label>Corner rounding <input id="radius" type="number" min="0" max="512" value="0"></label><input id="round-slider" type="range" min="0" max="160" value="0" aria-label="Corner rounding"><label>Opacity <input id="opacity" type="range" min="0" max="1" step="0.01" value="1"></label><label><input id="closed" type="checkbox" checked>Closed outline</label><div class="actions"><button id="duplicate">Duplicate</button><button id="delete">Delete</button><button id="flip-x">Flip X</button><button id="flip-y">Flip Y</button></div><label>Simplify threshold <input id="tolerance" type="number" min="0" max="100" step="0.5" value="2"></label><button id="simplify">Simplify points</button><div id="point-fields" hidden><h3>Selected point</h3><div class="fields"><label>X <input id="point-x" type="number"></label><label>Y <input id="point-y" type="number"></label></div><button id="remove-point">Remove point</button></div></div>
<h2>Layers</h2><div class="actions"><button id="back">Send back</button><button id="front">Bring front</button></div><div id="layers" aria-label="Layers"></div><h2>Canvas</h2><div class="fields"><label>Width <input id="canvas-width" type="number" min="32" max="4096" value="960"></label><label>Height <input id="canvas-height" type="number" min="32" max="4096" value="640"></label></div><label><input id="background-enabled" type="checkbox">Background <input id="background" type="color" value="#ffffff" aria-label="Canvas background"></label>
</aside></div>
<footer><p id="status" role="status" aria-live="polite">Drag to draw. Polygon: click points, then Enter. Points: double-click an edge to add a point.</p><button id="fit">Fit</button><button id="zoom-out" aria-label="Zoom out">−</button><output id="zoom-label">100%</output><button id="zoom-in" aria-label="Zoom in">+</button></footer>
<input id="svg-file" type="file" accept=".svg,image/svg+xml" hidden><input id="project-file" type="file" accept=".svgpaint,.json,application/json" hidden>
</body></html>
