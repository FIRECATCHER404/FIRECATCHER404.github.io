<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><meta name="description" content="Import two SVG files and animate the transformation."><title>Shape Morph</title><link rel="stylesheet" href="style.css?v=2"><script src="/analytics.js" defer></script><script type="module" src="app.js?v=2"></script></head><body>
<header class="top"><a href="../">Projects</a><h1>Shape morph</h1><a href="../svg-paint/">SVG Paint</a><button id="save">Save</button><button id="open">Open</button></header>
<main><section><header><button id="import-a">Import SVG A</button><span id="name-a">No file</span></header><canvas id="a" aria-label="First SVG. Drop an SVG file here."></canvas></section><section><header><button id="import-b">Import SVG B</button><span id="name-b">No file</span></header><canvas id="b" aria-label="Second SVG. Drop an SVG file here."></canvas></section><section class="preview"><header>Preview <output id="position">0.000</output></header><canvas id="preview" aria-label="Animated SVG transition"></canvas></section></main>
<div class="transport"><button id="play" disabled>Play</button><button id="reset">Reset</button><input id="timeline" type="range" min="0" max="1000" step="1" value="0" aria-label="Transition position"><label>Seconds <input id="duration" type="number" min="0.2" max="30" step="0.1" value="2"></label><select id="easing" aria-label="Easing"><option value="smooth">Smooth</option><option value="linear">Linear</option></select><select id="playback" aria-label="Playback mode"><option value="pingpong">Back and forth</option><option value="loop">Loop A to B</option><option value="once">Once</option></select></div>
<details id="export-options"><summary>Export</summary><div class="exports"><label>Size <select id="size"><option>256</option><option>512</option><option>1024</option></select></label><label>FPS <select id="fps"><option>12</option><option selected>24</option><option>30</option></select></label><button id="gif" disabled>GIF</button><button id="svg" disabled>Animated SVG</button><button id="png" disabled>PNG frame</button><button id="cancel" hidden>Cancel export</button></div></details>
<p id="status" role="status" aria-live="polite">Import two SVG files. The animation starts automatically.</p><input id="file-a" type="file" accept=".svg,image/svg+xml" hidden><input id="file-b" type="file" accept=".svg,image/svg+xml" hidden><input id="file" type="file" accept=".morph,.json,application/json" hidden>
</body></html>
